<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe </title>
    <link rel="stylesheet" href="juegoStyle.css">
</head>
<body>
   <header class="headerTicTacToe">
        <h1 class="titleTic-Tac-Toe">TIC-TAC-TOE<br><span>GAME</span></h1>
    </header>

    <main class="mainTicTacToe">
        <div class="containerTurnStatus">
            <h3 class="turnStatus" id="turn">WELCOME PLAYER</h3>
        </div>

        <div id="game" class="gameTicTacToe">
            <div class="cell" id="0"></div>
            <div class="cell" id="1"></div>
            <div class="cell" id="2"></div>
            <div class="cell" id="3"></div>
            <div class="cell" id="4"></div>
            <div class="cell" id="5"></div>
            <div class="cell" id="6"></div>
            <div class="cell" id="7"></div>
            <div class="cell" id="8"></div>
        </div>
        
        <div class="controls">
            <input class="btnR" id="btnRestart" type="button" value="Game Reset">
            <input class="btnNG" id="btnNewGame" type="button" value="New Game">
        </div>

        <div id="statistics">
            <h2 class="count" id="notification">
                Victories X: 0 / Victories O: 0 / Draws: 0
            </h2>
        </div>
    </main>

    <footer>
        <div class="containerCredits">
            <h5 class="creditsAccess">TERMINAL ACCESS</h5>
            <p class="webGameTitleCredtis">TicTacToe Web v1.6</p>
            <p class="authorNameCredits">Author: Juan Diego C.C.</p>
        </div>
    </footer>

    <script src="juegoJava.js"></script>
</body>
</html>
